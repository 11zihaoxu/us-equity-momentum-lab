[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "us-equity-momentum-lab"
version = "0.1.0"
description = "Reproducible US ETF dual-momentum research and backtesting lab"
requires-python = ">=3.10"
dependencies = ["pandas>=2.0", "numpy>=1.24", "Pillow>=10.0"]

[tool.setuptools.packages.find]
where = ["src"]
